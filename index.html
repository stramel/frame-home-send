<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Send to Frame Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Sends photos to a Frame Home TV through its owner's own photo relay (a small Cloudflare
   Worker; see relay/ in the Frame Home repo). The TV shows a QR code with a link to this page;
   after # it carries the secret mailbox code (t) and the relay's address (r), and never
   reaches GitHub. Each photo goes as it is, full size and quality. The one exception is HEIC,
   which the TV can't show: it becomes a full-resolution JPEG at top quality. The relay keeps a
   photo only until the TV has saved it. */
:root {
    --bg: #0b0e18;
    --ink: #ffffff;
    --ink-2: rgba(255, 255, 255, 0.78);
    --ink-3: rgba(255, 255, 255, 0.6);
    --fill: rgba(255, 255, 255, 0.08);
    --fill-2: rgba(255, 255, 255, 0.14);
    --ok: #6fdc8c;
    --bad: #ff8a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding: max(28px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
main { max-width: 560px; margin: 0 auto; }
h1 { margin: 8px 0 6px; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.6px; }
.lead { margin: 0 0 24px; font-size: 17px; line-height: 25px; color: var(--ink-2); }
.pick { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-radius: 14px; background: var(--fill-2); color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
.pick:active { transform: scale(0.98); }
.pick input { display: none; }
.send { margin-top: 12px; width: 100%; min-height: 56px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; }
.send:disabled { opacity: 0.4; cursor: default; }
.list { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--fill); }
.item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 4px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.66); font-size: 13px; line-height: 18px; font-weight: 700; text-align: center; }
.item.sent .badge { color: var(--ok); }
.item.failed .badge { color: var(--bad); }
.note { margin-top: 20px; font-size: 15px; line-height: 22px; color: var(--ink-3); }
.status { margin-top: 16px; min-height: 24px; font-size: 17px; line-height: 24px; font-weight: 600; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--bad); }
.hidden { display: none !important; }
</style>
</head>
<body>
<main>
    <h1>Send to Frame Home</h1>
    <p class="lead" id="lead">Pick photos and tap Send. They appear on your TV and join Your photos.</p>

    <div id="ready">
        <label class="pick"><input id="files" type="file" accept="image/*" multiple>Choose photos</label>
        <button class="send" id="send" disabled>Send</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <ul class="list" id="list"></ul>
    </div>

    <p class="note">Photos go at full size and quality to your own Frame Home relay, which keeps each one only until your TV has saved it. Only the TV showing this page's code receives them.</p>
</main>

<script>
(function () {
    'use strict';
    const MAX_BYTES = 95 * 1024 * 1024; // the relay's limit for one photo
    const args = {};
    location.hash.slice(1).split('&').forEach(function (kv) {
        const i = kv.indexOf('=');
        if (i > 0) args[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    const code = args.t || '';
    const relay = String(args.r || '').replace(/\/+$/, '');
    const $ = function (id) { return document.getElementById(id); };
    const items = [];
    let sending = false;

    if (!/^fh-[A-Za-z0-9]{16,61}$/.test(code) || !/^(https:\/\/[\w.-]+|http:\/\/localhost(:\d+)?)(\/[\w.\/-]*)?$/.test(relay)) {
        $('lead').textContent = 'Open this page from your TV: on Frame Home, go to Settings › Art › Add your images › From your phone, and scan the code with your camera. (A code scanned before the relay was set up won’t work; scan a new one.)';
        $('ready').classList.add('hidden');
        return;
    }

    function setStatus(text, kind) {
        const s = $('status');
        s.textContent = text;
        s.className = 'status' + (kind ? ' ' + kind : '');
    }

    function paintButton() {
        const left = items.filter(function (it) { return it.state !== 'sent'; }).length;
        $('send').disabled = sending || !left;
        $('send').textContent = sending ? 'Sending…' : left ? 'Send ' + left + (left === 1 ? ' photo' : ' photos') : 'Send';
    }

    function setItem(it, state, label) {
        it.state = state;
        it.el.className = 'item ' + state;
        it.badge.textContent = label;
        it.badge.classList.toggle('hidden', !label);
    }

    $('files').addEventListener('change', function (e) {
        Array.prototype.forEach.call(e.target.files, function (file) {
            const el = document.createElement('li');
            const img = document.createElement('img');
            const badge = document.createElement('span');
            img.alt = '';
            img.src = URL.createObjectURL(file);
            badge.className = 'badge hidden';
            el.className = 'item';
            el.appendChild(img);
            el.appendChild(badge);
            $('list').appendChild(el);
            items.push({ file: file, el: el, badge: badge, state: 'new' });
        });
        e.target.value = '';
        setStatus('');
        paintButton();
    });

    function isHeic(file) {
        return /^image\/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name);
    }

    // HEIC only: the TV can't show it, so redraw it as a JPEG at its full size and top quality.
    function asJpeg(file) {
        return new Promise(function (resolve, reject) {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = function () {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth;
                c.height = img.naturalHeight;
                c.getContext('2d').drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Couldn’t read this photo')); }, 'image/jpeg', 1);
            };
            img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Couldn’t read this photo')); };
            img.src = url;
        });
    }

    // The photo as it is, unless it's HEIC. Read into memory first: sending the picked file
    // straight from the photo library fails in some browsers. Same bytes either way.
    function prepare(file) {
        if (!isHeic(file)) {
            return file.arrayBuffer().then(function (buf) {
                return { blob: new Blob([buf], { type: file.type || 'image/jpeg' }), name: file.name || 'photo.jpg' };
            });
        }
        return asJpeg(file).then(function (b) { return { blob: b, name: (file.name || 'photo').replace(/\.[^.]*$/, '') + '.jpg' }; });
    }

    let expired = false;

    function send(it, n) {
        setItem(it, 'busy', 'Sending…');
        return prepare(it.file).then(function (p) {
            if (p.blob.size > MAX_BYTES) throw new Error('Over 95 MB');
            const name = Date.now().toString(36) + '-' + n + '-' + p.name.replace(/[^\w.-]/g, '_').slice(-120);
            return fetch(relay + '/box/' + code + '/' + encodeURIComponent(name), { method: 'PUT', headers: { 'Content-Type': p.blob.type || 'image/jpeg' }, body: p.blob });
        }).then(function (r) {
            if (r.status === 410) { expired = true; throw new Error('Code expired'); }
            if (!r.ok) throw new Error(r.status === 413 ? 'Too large' : 'Failed (' + r.status + ')');
            setItem(it, 'sent', 'Sent');
        }).catch(function (e) {
            setItem(it, 'failed', e.message || 'Failed');
            throw e;
        });
    }

    $('send').addEventListener('click', function () {
        const todo = items.filter(function (it) { return it.state !== 'sent'; });
        if (!todo.length || sending) return;
        sending = true;
        paintButton();
        setStatus('Sending ' + todo.length + (todo.length === 1 ? ' photo…' : ' photos…'));
        let failed = 0;
        // One at a time, so a slow connection isn't swamped.
        todo.reduce(function (p, it, i) {
            return p.then(function () {
                return send(it, i).catch(function () { failed++; }).then(function () {
                    return null;
                });
            });
        }, Promise.resolve()).then(function () {
            sending = false;
            paintButton();
            if (expired) setStatus('This code has expired. On the TV, open From your phone again and scan the new code.', 'bad');
            else if (failed) setStatus(failed + ' didn’t send. Check your connection and tap Send to try again.', 'bad');
            else setStatus('Sent. They’re on your TV now. Choose more, or you’re done.', 'ok');
        });
    });
})();
</script>
</body>
</html>
